[workspace]
members = [".", "crates/stoatmd-core"]
resolver = "2"

[package]
name = "nsh-app-stoatmd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"
stoatmd-core = { path = "crates/stoatmd-core" }
rfd = "0.15"
notify = "7"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
] }
objc2-core-foundation = "0.3.2"
objc2-core-text = "0.3.2"
objc2-foundation = { version = "0.3.2", features = [
    "NSData",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
