[workspace]
members = [".", "crates/stoatmd-core"]
resolver = "2"

[package]
name = "nsh-app-stoatmd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = "=0.5.0"
nsh-base = "=0.5.0"
stoatmd-core = { path = "crates/stoatmd-core" }
notify = "7"
serde_json = "1"
dirs = "6"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
nsh-platform-macos = "=0.5.0"
nsh-engine = { version = "=0.5.0", default-features = false }
nsh-dev = { version = "=0.5.0", features = ["client"] }
nsh-js = { version = "=0.5.0", default-features = false, features = ["crypto"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSWindow",
    "NSResponder",
    "NSView",
] }
objc2-core-foundation = "0.3.2"
objc2-core-text = "0.3.2"
objc2-foundation = { version = "0.3.2", features = [
    "NSData",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL", "NSObject"] }
objc2-ui-kit = { version = "0.3.2", features = ["UIApplication", "UIViewController", "UIPresentationController"] }
dispatch2 = "0.3"
futures-channel = "0.3"
block2 = "0.6"
security-framework = "3"
tempfile = "3"
