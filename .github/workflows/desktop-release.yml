# Build desktop packages on their native GitHub-hosted runners.
# Tagged builds are attached to the matching GitHub Release; manual runs only
# produce downloadable workflow artifacts for verification.
#
# On tags the macOS job also signs with the Developer ID certificate and
# notarizes through App Store Connect, so the release ships a notarized DMG.
# The repository is public, so the self-hosted Apple CI runner is not used (its
# runner group rejects public repositories); keep signing credentials in
# repository secrets instead. Pull requests never receive those secrets and
# only produce an ad-hoc signed ZIP.
#
# Hosted macOS arm64 runners sometimes never hand out a machine: run 41861167240
# was cancelled after 15 minutes with "The job was not acquired by Runner of
# type hosted", turning a green pull request red. desktop-release-retry.yml
# re-runs jobs like that; builds that actually started are left to a human.
name: Desktop · macOS, Windows & Linux

on:
  pull_request:
    paths:
      - "App.tsx"
      - "assets/**"
      - "crates/**"
      - "scripts/desktop_release.py"
      - "scripts/macos_release.py"
      - "scripts/ios.py"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "nsh.json"
      - ".github/workflows/desktop-release.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v1.2.0)"
        required: true
        type: string
      build:
        description: "Optional build number override"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-24.04
            target: linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag and build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            TAG="v0.0.0"
            BUILD_OVERRIDE="0"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
            BUILD_OVERRIDE="$DISPATCH_BUILD"
          else
            TAG="${GITHUB_REF_NAME}"
            BUILD_OVERRIDE=""
          fi
          [[ "$TAG" == v* ]] || { echo "::error::Tag must start with v"; exit 1; }
          VERSION="${TAG#v}"
          BUILD="$BUILD_OVERRIDE"
          if [[ -z "$BUILD" ]]; then
            BUILD="$(git rev-list --count "$TAG")"
          fi
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::Build number must be an integer"; exit 1; }
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_BUILD: ${{ inputs.build }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          # nsh 0.5 Linux 后端：GTK 4 + WebKitGTK 6 之外还需要 GStreamer 核心与
          # base 插件的开发头（音频解码/混音），缺少时 gstreamer-sys 构建失败。
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang

      - name: Install nsh on macOS / Linux
        if: matrix.target != 'windows'
        shell: bash
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.5.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nsh on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = "v0.5.0"
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install asc for notarization
        if: matrix.target == 'macos' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          brew install asc
          asc --version

      - name: Import Developer ID certificate
        if: matrix.target == 'macos' && github.event_name != 'pull_request'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Configure the MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD repository secrets"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # codesign needs explicit private-key access in a non-interactive session.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # shellcheck disable=SC2046  # expected word splitting: one path per keychain
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$IDENTITY" ]] || {
            echo "::error::The imported certificate is not a Developer ID Application identity"
            exit 1
          }
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      - name: Package desktop app
        shell: bash
        env:
          STOATMD_GOOGLE_CLIENT_ID: ${{ github.event_name == 'pull_request' && 'stoatmd-ci-placeholder.apps.googleusercontent.com' || secrets.STOATMD_GOOGLE_CLIENT_ID || 'stoatmd-ci-placeholder.apps.googleusercontent.com' }}
          STOATMD_GOOGLE_CLIENT_SECRET: ${{ github.event_name == 'pull_request' && 'stoatmd-ci-placeholder' || secrets.STOATMD_GOOGLE_CLIENT_SECRET || 'stoatmd-ci-placeholder' }}
          STOATMD_DROPBOX_APP_KEY: ${{ github.event_name == 'pull_request' && 'stoatmd-ci-placeholder' || secrets.STOATMD_DROPBOX_APP_KEY || 'stoatmd-ci-placeholder' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: |
          set -euo pipefail
          if [[ -z "$STOATMD_GOOGLE_CLIENT_ID" || -z "$STOATMD_GOOGLE_CLIENT_SECRET" || -z "$STOATMD_DROPBOX_APP_KEY" ]]; then
            echo "::error::Configure STOATMD_GOOGLE_CLIENT_ID, STOATMD_GOOGLE_CLIENT_SECRET and STOATMD_DROPBOX_APP_KEY repository secrets"
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            # A release must not silently embed the placeholder OAuth client.
            for name in STOATMD_GOOGLE_CLIENT_ID STOATMD_GOOGLE_CLIENT_SECRET STOATMD_DROPBOX_APP_KEY; do
              if [[ "${!name}" == *placeholder* ]]; then
                echo "::error::Configure the $name repository secret before releasing"
                exit 1
              fi
            done
          fi
          if [[ "${{ matrix.target }}" == "windows" ]]; then
            python scripts/desktop_release.py --version "$VERSION" --build "$BUILD"
          elif [[ "${{ matrix.target }}" == "macos" && "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            if [[ -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
              echo "::error::The Developer ID certificate was not imported"
              exit 1
            fi
            if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" || -z "${ASC_PRIVATE_KEY:-}" ]]; then
              echo "::error::Configure the ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY repository secrets"
              exit 1
            fi
            ASC_BYPASS_KEYCHAIN=1 python3 scripts/macos_release.py \
              --identity "$MACOS_SIGNING_IDENTITY" \
              --version "$VERSION" --build "$BUILD"
          else
            python3 scripts/desktop_release.py --version "$VERSION" --build "$BUILD"
          fi

      - name: Upload macOS release artifact
        if: matrix.target == 'macos' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stoatmd-macos
          path: |
            .nsh/release-macos/StoatMD-*.dmg
            .nsh/release-macos/StoatMD-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop artifact
        if: matrix.target != 'macos' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stoatmd-${{ matrix.target }}
          path: |
            .nsh/release-desktop/StoatMD-*-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach desktop builds to GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: stoatmd-*
          path: release-assets
          merge-multiple: true

      - name: Flatten artifact directories
        working-directory: release-assets
        run: |
          set -euo pipefail
          # upload-artifact 会保留上传路径的公共父目录（.nsh/release-*），
          # 多个 platform artifact 合并后这里统一摊平。
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          ls -lh

      - name: Prepare release assets
        working-directory: release-assets
        run: |
          set -euo pipefail
          ls -lh
          sha256sum StoatMD-*.dmg StoatMD-*.zip StoatMD-*.tar.gz > SHA256SUMS-desktop.txt
          cat SHA256SUMS-desktop.txt
          dmg="$(ls StoatMD-*.dmg)"
          # 官网与应用内更新按这个固定名字下载；内容与版本化 DMG 相同。
          cp "$dmg" StoatMD-macos.dmg

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/desktop-release-notes.md"
          {
            echo "## StoatMD ${TAG#v} — Desktop builds"
            echo
            echo "Free desktop builds for macOS, Windows and Linux."
            echo
            echo "macOS ships a Developer ID signed and notarized DMG; the ZIP is the notarization upload."
            echo "Windows packages are unsigned. On first launch, follow your operating system's security prompt."
            echo
            echo "Verify downloaded packages with SHA256SUMS-desktop.txt."
          } > "$NOTES"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "StoatMD ${TAG#v}" --notes-file "$NOTES"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "StoatMD ${TAG#v}" --notes-file "$NOTES" release-assets/*
          fi
