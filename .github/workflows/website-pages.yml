# StoatMD 官网 → Cloudflare Pages
# - push 到 main 且 website/ 或本 workflow 有变更：同一 job 内构建并发布
# - pull_request 同类路径变更：仅构建校验，不发布
# - 不使用 actions/upload-artifact / download-artifact（组织 artifact 配额不可用）
# 凭据：组织/仓库 secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（勿硬编码）
# 项目名：vars.CLOUDFLARE_PAGES_PROJECT，默认 stoatmd-website

name: Website · Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"

concurrency:
  group: website-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 可用仓库 Variable `CLOUDFLARE_PAGES_PROJECT` 覆盖；未设置时默认 stoatmd-website
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'stoatmd-website' }}

jobs:
  website:
    name: 官网构建与发布
    # 公开仓库用 GitHub 托管的 Ubuntu（标准 runner 免费），不依赖自托管 runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站
        run: npm run build

      - name: 检查 Secrets（仅 main 发布）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "请在组织或仓库 Settings → Secrets and variables → Actions 中配置上述 secrets。"
            echo "API Token 权限见 website/README.md「CI 部署」一节。"
            exit 1
          fi

      - name: 确保 Pages 项目存在
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          # GitHub 托管的 Ubuntu 没有预装 wrangler：用 npx 跑固定大版本
          npx --yes wrangler@4 --version
          echo "检查 / 创建 Pages 项目: ${PAGES_PROJECT}"
          if npx --yes wrangler@4 pages project create "${PAGES_PROJECT}" --production-branch=main; then
            echo "已创建项目 ${PAGES_PROJECT}"
          else
            echo "项目可能已存在（或 create 返回非零），继续尝试部署"
          fi

      - name: 部署到 Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 固定 v4，交给 action 安装；不依赖 runner 预装
          wranglerVersion: "4"
          # 同 job 内刚构建的 dist，无需 artifact 中转
          command: pages deploy website/dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
          workingDirectory: .
