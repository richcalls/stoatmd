# 手动自检组织级 Apple CI runner：系统、Xcode、签名证书、asc、nsh 与磁盘。
# 不构建、不公证、不发版；用来确认 iOS / macOS 共用 runner 环境是否可用。
#
# 只在私有仓库生效：公开仓库会被 `github.event.repository.private` 守卫跳过，
# `richcalls/stoatmd` 公开后该 runner 不再参与任何发布流程。
#
# 触发：Actions → macOS · Runner Smoke Test → Run workflow

name: macOS · Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Check runner
    if: ${{ github.repository == 'richcalls/stoatmd' && github.event.repository.private }}
    runs-on: [self-hosted, macOS, ARM64, apple-ci]
    timeout-minutes: 10
    env:
      ASC_BYPASS_KEYCHAIN: "1"
    steps:
      - name: Add user tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          # 按 $HOME 注入，不写死用户名。
          {
            echo "$HOME/.local/bin"
            echo "/opt/homebrew/bin"
            echo "/usr/local/bin"
          } >> "$GITHUB_PATH"

      - name: System
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          xcodebuild -version
          xcode-select -p
          df -h /

      - name: Tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in nsh asc gh codesign xcrun security; do
            printf '%-10s ' "$tool"
            command -v "$tool" || { echo "missing"; exit 1; }
          done
          nsh --version
          asc auth status
          gh --version | head -1
          /usr/bin/python3 --version

      - name: Resolve signing identity
        shell: bash
        env:
          PREFERRED_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          IDENTITY="${PREFERRED_IDENTITY:-}"
          if [[ -z "$IDENTITY" ]]; then
            # 默认取钥匙串里第一张 Developer ID Application 证书；
            # 多张证书时用仓库变量 MACOS_SIGNING_IDENTITY 指定。
            IDENTITY="$(security find-identity -v -p codesigning \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          fi
          [[ -n "$IDENTITY" ]] || {
            echo "::error::登录钥匙串里没有 Developer ID Application 证书"; exit 1;
          }
          security find-identity -v -p codesigning | grep -Fq "$IDENTITY" || {
            echo "::error::钥匙串里找不到指定的签名身份: $IDENTITY"; exit 1;
          }
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "签名身份: $IDENTITY"

      - name: Keychain signing access
        shell: bash
        run: |
          set -euo pipefail
          cp /bin/echo "$RUNNER_TEMP/codesign-check"
          # 30 秒内必须完成；如果钥匙串弹窗等待授权，这里会失败而不是挂住整个 job。
          perl -e 'alarm 30; exec @ARGV' -- \
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            "$RUNNER_TEMP/codesign-check"
          codesign -dv "$RUNNER_TEMP/codesign-check"
          echo "codesign 可以使用登录钥匙串里的 Developer ID 证书。"
