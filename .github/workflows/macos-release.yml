# 在 GitHub 托管的 macOS runner 上构建、签名、公证并发布 macOS 安装包。
#
# 公开仓库使用 GitHub 的标准 macOS runner（Apple Silicon，免费额度），
# 不再依赖自托管 Apple CI。签名证书、公证与 asc 凭据全部来自仓库 Secrets，
# 由 job 临时导入钥匙串 / 写入 ~/.asc/config.json。
#
# 一次性准备（Secrets 清单与生成方式）见 docs/ops/macos-ci.md。
#
# Secrets:
#   MACOS_CERT_P12 / MACOS_CERT_PASSWORD  Developer ID Application 证书（base64 P12）
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY  App Store Connect API Key（公证用）
#   STOATMD_GOOGLE_CLIENT_ID / STOATMD_GOOGLE_CLIENT_SECRET / STOATMD_DROPBOX_APP_KEY
#   STOATMD_COMMUNITY_TOKEN  fine-grained PAT，对 richcalls/stoatmd-community
#                            有 Contents: Read and write 权限。

name: macOS · Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.2.0，必须已存在）"
        required: true
      build:
        description: "Build number（留空则用 git rev-list --count HEAD）"
        required: false
      publish:
        description: "构建成功后发布到 richcalls/stoatmd-community"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # asc 直接读 ~/.asc/config.json，不碰钥匙串里的 API key 副本
      ASC_BYPASS_KEYCHAIN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Check signing secrets
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::缺少 secret $name（配置方式见 docs/ops/macos-ci.md）"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1

      - name: Install nsh
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.5.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install asc
        shell: bash
        run: |
          set -euo pipefail
          brew install asc
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version and build
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          BUILD="${{ inputs.build }}"
          [[ "$TAG" == v* ]] || { echo "::error::tag 必须以 v 开头"; exit 1; }
          VERSION="${TAG#v}"
          if [[ -z "$BUILD" ]]; then
            BUILD="$(git rev-list --count HEAD)"
          fi
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build 必须是整数"; exit 1; }
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG (version $VERSION, build $BUILD)"

      - name: Import signing certificate
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # 临时钥匙串排到搜索列表最前，codesign 才能找到它
          # shellcheck disable=SC2046  # 故意按词展开多个原有钥匙串路径
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configure asc
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          mkdir -p "$HOME/.asc"
          python3 - "$KEY" <<'PY'
          import json, os, sys
          config = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "private_key_path": sys.argv[1],
          }
          with open(os.path.expanduser("~/.asc/config.json"), "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
          PY
          chmod 600 "$HOME/.asc/config.json"
          asc auth status

      - name: Preflight
        shell: bash
        env:
          PREFERRED_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for tool in nsh xcodebuild codesign xcrun security asc gh; do
            command -v "$tool" >/dev/null || { echo "::error::找不到 $tool"; exit 1; }
          done
          /usr/bin/python3 --version
          nsh --version
          xcodebuild -version | head -2
          asc auth status >/dev/null
          IDENTITY="${PREFERRED_IDENTITY:-}"
          if [[ -z "$IDENTITY" ]]; then
            # 默认取钥匙串里第一张 Developer ID Application 证书；
            # 多张证书时用仓库变量 MACOS_SIGNING_IDENTITY 指定。
            IDENTITY="$(security find-identity -v -p codesigning \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          fi
          [[ -n "$IDENTITY" ]] || {
            echo "::error::导入的证书里没有 Developer ID Application"; exit 1;
          }
          security find-identity -v -p codesigning | grep -Fq "$IDENTITY" || {
            echo "::error::钥匙串里找不到指定的签名身份: $IDENTITY"; exit 1;
          }
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "签名身份: $IDENTITY"
          df -h "$RUNNER_WORKSPACE"

      - name: Build, sign, notarize, staple
        shell: bash
        env:
          STOATMD_GOOGLE_CLIENT_ID: ${{ secrets.STOATMD_GOOGLE_CLIENT_ID }}
          STOATMD_GOOGLE_CLIENT_SECRET: ${{ secrets.STOATMD_GOOGLE_CLIENT_SECRET }}
          STOATMD_DROPBOX_APP_KEY: ${{ secrets.STOATMD_DROPBOX_APP_KEY }}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/macos_release.py \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --version "${{ steps.meta.outputs.version }}" \
            --build "${{ steps.meta.outputs.build }}"

      - name: Stage release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          OUT=".nsh/release-macos"
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD="${{ steps.meta.outputs.build }}"
          DMG="$OUT/StoatMD-${VERSION}-${BUILD}.dmg"
          ZIP="$OUT/StoatMD-${VERSION}-${BUILD}.zip"
          test -f "$DMG"
          test -f "$ZIP"
          test -f "$OUT/SHA256SUMS.txt"
          STAGE="$RUNNER_TEMP/release-assets"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "$DMG" "$ZIP" "$OUT/SHA256SUMS.txt" "$STAGE/"
          # 官网固定直链依赖这个文件名：
          # https://github.com/richcalls/stoatmd-community/releases/latest/download/StoatMD-macos.dmg
          cp "$DMG" "$STAGE/StoatMD-macos.dmg"
          ls -lh "$STAGE"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## StoatMD ${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})"
            echo
            echo "- Tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- Stage: \`${{ steps.assets.outputs.stage }}\`"
            echo
            echo '```'
            cat .nsh/release-macos/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STOATMD_COMMUNITY_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          STAGE: ${{ steps.assets.outputs.stage }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::缺少 secret STOATMD_COMMUNITY_TOKEN（fine-grained PAT，Contents: Read/Write）"
            exit 1
          fi
          REPO=richcalls/stoatmd-community
          NOTES="$RUNNER_TEMP/release-notes.md"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## StoatMD ${VERSION}（macOS）"
            echo
            echo "Apple Silicon，macOS 14+。"
            echo
            if [[ -n "$PREV" ]]; then
              git log --pretty='- %s (%h)' "${PREV}..${TAG}"
            else
              git log --pretty='- %s (%h)' "${TAG}" | head -50
            fi
          } > "$NOTES"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$STAGE"/* -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" \
              --title "StoatMD ${VERSION}（macOS）" --notes-file "$NOTES"
          else
            gh release create "$TAG" -R "$REPO" \
              --title "StoatMD ${VERSION}（macOS）" \
              --notes-file "$NOTES" \
              "$STAGE"/*
          fi
          gh release view "$TAG" -R "$REPO" --json url,assets \
            --jq '"Release: " + .url + "\n" + (.assets[] | "  " + .name + "  " + (.size | tostring))'
