  const paragraphCount = (article.match(/<(?:p|blockquote)[ >]/g)||[]).length;
  const headingCount = (article.match(/<h[1-6][ >]/g)||[]).length;
  const data = [
    {inspector:false, tab:'outline', mode:'read', nav:true, mobileNav:false, selected:'sm-collect'},
    {inspector:false, tab:'outline', mode:'read', nav:true, mobileNav:false, selected:'sm-collect'}
  ];

    const incoming = saved?.privateContent?.views;

        <div class="sm-work">
          <main class="sm-reader" aria-label="文章内容"><article class="sm-document">${article}</article><pre class="sm-code" hidden></pre></main>
          <button class="sm-peek cursor-interaction" data-action="open" aria-label="展开目录与文章信息" aria-expanded="false" aria-controls="${uid}-inspector">${icon('list-tree')}<span>目录</span></button>
          <aside id="${uid}-inspector" class="sm-inspector" aria-label="文章检查栏" hidden>
            <div class="sm-inspector-top" role="tablist" aria-label="文章面板">
              <button id="${uid}-outline-tab" class="sm-tab cursor-interaction" data-tab="outline" role="tab" aria-controls="${uid}-outline" aria-selected="true">${icon('list-tree')}目录</button>
              <button id="${uid}-info-tab" class="sm-tab cursor-interaction" data-tab="info" role="tab" aria-controls="${uid}-info" aria-selected="false">${icon('info')}信息</button>
              <button class="sm-icon cursor-interaction" data-action="close" aria-label="收起右栏" data-tooltip="收起右栏">${icon('panel-right-close')}</button>
            </div>
            <div id="${uid}-outline" role="tabpanel" aria-labelledby="${uid}-outline-tab" data-panel="outline">
              <p class="sm-caption">文章结构</p>
              <nav class="sm-toc" aria-label="文章目录">${contents.map(([title,id,sub])=>`<button class="${sub?'sm-sub ':''}cursor-interaction" data-target="${id}" aria-current="${id==='sm-collect'}">${title}</button>`).join('')}</nav>
            </div>
            <div id="${uid}-info" role="tabpanel" aria-labelledby="${uid}-info-tab" data-panel="info" hidden>
              <h3 class="sm-detail-title">统计</h3>
              <dl class="sm-details"><div><dt>字符数</dt><dd>${characterCount}</dd></div><div><dt>预计阅读</dt><dd>约 ${Math.max(1,Math.ceil(characterCount/300))} 分钟</dd></div><div><dt>段落</dt><dd>${paragraphCount}</dd></div><div><dt>标题</dt><dd>${headingCount}</dd></div></dl>
              <hr class="sm-sep">
              <h3 class="sm-detail-title">文件信息</h3>
              <dl class="sm-details"><div><dt>创建于</dt><dd>2026/10/28 09:41</dd></div><div><dt>修改于</dt><dd>2026/10/30 10:32</dd></div><div><dt>格式</dt><dd>Markdown</dd></div><div class="sm-path"><dt>位置</dt><dd>forecho / Clippings /<br>${shortTitle}.md</dd></div></dl>
              <hr class="sm-sep"><h3 class="sm-detail-title">标签</h3><div class="sm-tags"><span class="sm-tag">学习</span><span class="sm-tag">知识管理</span></div>
            </div>
          </aside>
        </div>
      </div>
    </div>`;
    const app=stage.querySelector('.sm-app');
    const reader=app.querySelector('.sm-reader');
    const pre=reader.querySelector('pre');
    pre.textContent=markdown;
    function render() {
      const s=data[i];
      app.querySelector('.sm-work').classList.toggle('sm-open',s.inspector);
      app.querySelector('.sm-inspector').hidden=!s.inspector;
      app.querySelector('.sm-peek').hidden=s.inspector;
      app.querySelector('.sm-peek').setAttribute('aria-expanded',String(s.inspector));
      app.classList.toggle('sm-nav-hidden',!s.nav);
      app.classList.toggle('sm-mobile-nav',s.mobileNav);
      app.querySelector('[data-action="nav"]').setAttribute('aria-expanded',String(s.nav));
      app.querySelectorAll('[data-tab]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.tab===s.tab)));
      app.querySelectorAll('[data-panel]').forEach(el=>el.hidden=el.dataset.panel!==s.tab);
      app.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===s.mode)));
      reader.classList.toggle('sm-split',s.mode==='split');
      pre.hidden=s.mode==='read';
      reader.querySelector('.sm-document').hidden=s.mode==='code';
      app.querySelectorAll('[data-target]').forEach(el=>el.setAttribute('aria-current',String(el.dataset.target===s.selected)));
    }
    stage._render=render;
    app.addEventListener('click',event=>{
      const button=event.target.closest('button');
      if(!button) return;
      const s=data[i];
      const action=button.dataset.action;
      if(action==='open') s.inspector=true;
      if(action==='close') s.inspector=false;
      if(action==='nav') { s.nav=!s.nav; s.mobileNav=!s.mobileNav; }
      if(button.dataset.tab) s.tab=button.dataset.tab;
      if(button.dataset.mode) s.mode=button.dataset.mode;
      if(button.dataset.target) {
        s.selected=button.dataset.target;
        reader.querySelectorAll('[data-section]').forEach(el=>el.classList.toggle('sm-section-current',el.dataset.section===s.selected));
      }
      if(button.classList.contains('sm-group')) {
        const expanded=button.getAttribute('aria-expanded')==='true';
        button.setAttribute('aria-expanded',String(!expanded));
        button.nextElementSibling.hidden=expanded;
      }
      render();
      save();
    });
    app.querySelector('input').addEventListener('input',event=>{
      const query=event.target.value.trim().toLocaleLowerCase();
      app.querySelectorAll('.sm-note').forEach(note=>note.hidden=!note.textContent.toLocaleLowerCase().includes(query));
    });
    app.addEventListener('keydown',event=>{
      if(event.key==='Escape' && data[i].inspector) { data[i].inspector=false;render();app.querySelector('.sm-peek').focus();save(); }
      if((event.metaKey||event.ctrlKey) && event.key.toLowerCase()==='k') { event.preventDefault();app.querySelector('input').focus(); }
      const tab=event.target.closest('[data-tab]');
      if(tab && ['ArrowLeft','ArrowRight'].includes(event.key)) {
        event.preventDefault();data[i].tab=data[i].tab==='outline'?'info':'outline';render();app.querySelector(`[data-tab="${data[i].tab}"]`).focus();save();
      }
    });
    render();
  });
  function renderDesign() {
    root.querySelectorAll('.sm-app').forEach(app=>{
      app.style.colorScheme=design.appearance==='浅色'?'light':design.appearance==='深色'?'dark':'inherit';
      app.style.setProperty('--sm-nav-width',`${design.sidebar}px`);
      app.style.setProperty('--sm-doc-width',`${design.article}px`);
    });
  }
  function save() {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{design:'StoatMD 双侧栏设计',views:data.map((s,i)=>({方案:'内嵌阅读画布',右栏:s.inspector?'展开':'收起',面板:s.tab==='outline'?'目录':'信息'}))},privateContent:{views:data}}).catch(()=>{});
  }
  window.addEventListener('openai:set_globals',event=>{
    const saved=event.detail?.globals?.widgetState;
    if(saved) {restore(saved);root.querySelectorAll('[data-variant]').forEach(stage=>stage._render());}
  });
  renderDesign();
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:renderDesign});
    tweak.addSelect(design,'appearance',{label:'外观',options:['跟随系统','浅色','深色']});
    tweak.addSlider(design,'sidebar',{label:'左栏宽度',min:180,max:240,step:4,unit:'px'});
    tweak.addSlider(design,'article',{label:'正文最大宽度',min:520,max:720,step:10,unit:'px'});
  }
})();
</script>
