        <div class="nav-title">写作的框架</div>

      </div>
      <div class="seg-phone">
        <span class="on">编辑</span>
        <span>预览</span>
      </div>
      <div class="phone-body">
        <div class="phone-src src"><span class="h"># 写作的框架</span>

<span class="h">## 为什么需要框架</span>
好的文章不是灵感的堆砌，而是<span class="bm">**</span><span class="b">结构</span><span class="bm">**</span>的展开。
框架让读者知道自己站在哪里，也让作者知道下一步写什么。

<span class="h">## 三个层次</span>
<span class="li">- </span><span class="bm">**</span><span class="b">骨架</span><span class="bm">**</span>：论点与顺序
<span class="li">- </span><span class="bm">**</span><span class="b">肌肉</span><span class="bm">**</span>：例证与细节
<span class="li">- </span><span class="bm">**</span><span class="b">皮肤</span><span class="bm">**</span>：语气与节奏

<span class="q">&gt; 先写骨架，再填血肉。</span>

在编辑器里用 <span class="code">Cmd + B</span> 加粗。
<span class="cursor"></span></div>
      </div>
      <div class="format-hint">
        <span>#</span><span>**</span><span>*</span><span>`</span><span>&gt;</span><span>-</span>
      </div>
      <div class="home-indicator"><i></i></div>
    </div>
  </div>
